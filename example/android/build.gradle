// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.10.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven {  url 'https://maven.fpregistry.io/releases'  }
    maven {  url 'https://jitpack.io'  }
  }

  // androidx.core 1.17+ is compiled with Kotlin 2.1 metadata that the 2.0.x compiler
  // (required for RN 0.76's gradle plugin) can't read. No dep requests 1.18.0 directly;
  // Gradle's "highest wins" conflict resolution picks it as the latest published.
  // Force it down to a Kotlin-2.0-compatible line across all subprojects.
  configurations.all {
    resolutionStrategy {
      force "androidx.core:core:1.13.1"
      force "androidx.core:core-ktx:1.13.1"
    }
  }
}

apply plugin: "com.facebook.react.rootproject"
