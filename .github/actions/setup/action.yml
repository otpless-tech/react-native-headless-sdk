name: Setup
description: Set up Node.js (via .nvmrc) with node_modules caching. Does NOT install
  dependencies — `make gate`'s `install` step (yarn install --frozen-lockfile) owns that, so
  callers just run `make gate` (or another make target) after this action.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc

    - name: Cache node_modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: node_modules
        key: ${{ runner.os }}-yarn-${{ hashFiles('package.json') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
