name: Docs Sync

# Keeps docs/SDK-GUIDE.md and CHANGELOG.md in sync with the bridge code.
# Runs on every push (PR merge) to main that touches SDK-relevant files,
# following the protocol defined in .claude/skills/docs-sync/SKILL.md.
#
# This workflow NEVER pushes to main. Claude only edits files in the runner's
# working tree; the create-pull-request step then opens a "docs: sync" PR for
# review. Merge it (or enable auto-merge) to publish the doc update.
#
# Loop protection:
#   - the paths filter below excludes doc-only changes, so merging the docs PR
#     (which touches only docs/** and CHANGELOG.md) does not re-trigger this job
#   - the docs PR branch is fixed (docs/sync) and reused/updated across runs
#     rather than spawning a new branch per triggering SHA
#   - the docs PR branch is deleted on merge
#
# Required repo secret: ANTHROPIC_API_KEY

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "ios/**"
      - "package.json"
      - "otpless-headless-rn.podspec"
  workflow_dispatch:

concurrency:
  group: docs-sync-main
  cancel-in-progress: false

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # claude-code-action OIDC token exchange
    steps:
      - name: Checkout (full history for range diffs)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Update docs with Claude Code (edits working tree only)
        uses: anthropics/claude-code-action@536f2c32a39763739000b0e1ac69ca2647d97ce9 # v1.0.170
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are running the documentation-sync job for this repository.
            You must ONLY edit files in the working tree. Do NOT run git commit,
            git push, or create branches — a later workflow step turns your
            edits into a pull request.

            Follow the docs-sync protocol in .claude/skills/docs-sync/SKILL.md:

            1. Read .claude/skills/docs-sync/SKILL.md and CLAUDE.md in full,
               then determine the last-synced commit SHA (LAST):
                 - Prefer `git show origin/main:docs/.doc-sync-state` over the
                   checkout's working-tree copy of docs/.doc-sync-state — the
                   working tree may be ahead or behind origin/main depending
                   on how this run was triggered. Fall back to the
                   working-tree copy only if that git show fails.
                 - Per the skill's stale-docs rule: if
                   `git cat-file -e "$LAST^{commit}"` fails or
                   docs/.doc-sync-state is missing entirely, treat the state
                   as absent and do a full re-verify of every SDK-GUIDE
                   section against current code instead of a diff-based sync.
               The commit that triggered this run is ${{ github.sha }} (HEAD).
            2. Compute `git diff $LAST..HEAD` restricted to src/, android/,
               ios/, package.json, otpless-headless-rn.podspec, and
               CHANGELOG.md. If the range is empty or touches only example/,
               just write ${{ github.sha }} into docs/.doc-sync-state and
               stop.
            3. Read every changed source file IN FULL (not just the diff
               hunks) so your doc edits reflect actual behavior, then update
               docs/SDK-GUIDE.md surgically per the source-file → section map
               in the skill. Do not rewrite unaffected sections. If the TS
               surface (src/index.tsx or src/models.tsx) changed, also run
               `bash scripts/check-ts-surface.sh --update` and review the
               diff to api/index.d.ts / api/models.d.ts before finishing.
            4. Update CHANGELOG.md per the changelog rules in the skill
               (Unreleased section per merged PR; full release entry when
               package.json's version changed).
            5. Write ${{ github.sha }} (full SHA, single line) into
               docs/.doc-sync-state.
            6. Run `bash scripts/docs-verify.sh` per the skill's final step.
               It must pass before you finish — if it reports any FAIL, fix
               the underlying drift (do not weaken the script) and rerun it
               until it passes.
            7. Finally, write a short markdown summary of what you changed and
               why (sections touched, contract changes, anything you could not
               verify) into /tmp/docs-sync-summary.md — this becomes the PR
               body. If nothing needed updating, say so in that file.

            Accuracy rules: never invent behavior — every statement you write
            into the docs must be verifiable in the code you read this run. If
            something is ambiguous, describe what the code does, not what it
            probably intends. If you find the docs already contradict
            pre-existing code (not part of this diff), fix it and mention it
            in the summary. If, while following this protocol, you find the
            docs-sync SKILL.md or CLAUDE.md protocol itself is wrong or
            ambiguous, correct it (per the skill's committing rule) and
            mention it in the summary.
          claude_args: |
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git show:*),Bash(git cat-file:*),Bash(ls:*),Bash(cat:*),Bash(bash scripts/docs-verify.sh),Bash(bash scripts/check-ts-surface.sh:*),Read,Edit,Write,Grep,Glob"
            --max-turns 80

      - name: Read PR body from Claude's summary
        id: summary
        run: |
          if [ -f /tmp/docs-sync-summary.md ]; then
            {
              echo 'body<<DOCS_SYNC_EOF'
              cat /tmp/docs-sync-summary.md
              echo 'DOCS_SYNC_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'body=Automated documentation sync (no summary produced).' >> "$GITHUB_OUTPUT"
          fi

      - name: Open docs-sync pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: docs/sync
          delete-branch: true
          add-paths: |
            docs/SDK-GUIDE.md
            docs/.doc-sync-state
            CHANGELOG.md
            CLAUDE.md
            .claude/skills/docs-sync/SKILL.md
            api/index.d.ts
            api/models.d.ts
          commit-message: "docs: sync SDK-GUIDE and CHANGELOG to ${{ github.sha }} [docs-sync]"
          title: "docs: sync documentation to ${{ github.sha }}"
          body: ${{ steps.summary.outputs.body }}
          labels: documentation
